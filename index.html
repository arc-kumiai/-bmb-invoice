/* 保存領域。この端末のブラウザ（localStorage）に保存します */
const K = { inv: "bmb:invoices", cus: "bmb:customers", brand: "bmb:brand" };
const store = {
  async get(key) {
    try {
      const v = localStorage.getItem(key);
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      localStorage.setItem(key, JSON.stringify(value));
      return true;
    } catch (e) { return false; }  // 容量超過など
  },
};

const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
};

const jpDate = (iso) => {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  if (!y || !m || !d) return iso;
  return `${y}年${Number(m)}月${Number(d)}日`;
};

/* 内容量に応じて高さが伸びる入力欄（文字が隠れないように） */
function AutoText({ value, onChange, placeholder, size = 11 }) {
  const ref = useRef(null);
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }, [value, size]);
  return (
    <textarea ref={ref} rows={1} className="f" value={value} placeholder={placeholder} onChange={onChange}
              style={{ fontSize: size, lineHeight: 1.55, resize: "none", overflow: "hidden", display: "block" }} />
  );
}

  useEffect(() => {
    (async () => {
      const [inv, cus, brand] = await Promise.all([store.get(K.inv), store.get(K.cus), store.get(K.brand)]);
      if (Array.isArray(inv)) setInvoices(inv);
      if (Array.isArray(cus)) setCustomers(cus);
      if (brand) {
        if (brand.profileKey) setProfileKey(brand.profileKey);
        if (brand.logo) setLogo(brand.logo);
        if (brand.stamp) setStamp(brand.stamp);
        if (brand.me) setMe((m) => ({ ...m, ...brand.me }));
      }
    })();
    return () => clearTimeout(timer.current);
  }, []);

  /* --- 請求書 --- */
  const currentDoc = invoices.find((x) => x.id === currentId) || null;

  const defaultName = () =>
    [meta.no, to.company, meta.subject].filter(Boolean).join("　") || "無題の請求書";

  /* asNew を true にすると別名で新しい1件として保存します */
  const saveInvoice = async (asNew) => {
    let name = currentDoc ? currentDoc.name : "";
    if (asNew || !currentId || !name) {
      const input = window.prompt("保存する名前を入力してください", asNew ? "" : (name || defaultName()));
      if (input === null) return;
      name = input.trim() || defaultName();
    }
    const id = asNew || !currentId ? `inv-${Date.now()}` : currentId;
    const doc = { id, name, meta, to, items, savedAt: new Date().toISOString() };
    const next = [doc, ...invoices.filter((x) => x.id !== id)];
    setInvoices(next);
    setCurrentId(id);
    const ok = await store.set(K.inv, next);
    await store.set(K.brand, { logo, stamp, me, profileKey });
    flash(ok ? `「${name}」を保存しました` : "この画面を閉じるまでの一時保存になります");
  };

  const renameInvoice = async () => {
    if (!currentDoc) return;
    const input = window.prompt("名前を変更", currentDoc.name || defaultName());
    if (input === null) return;
    const name = input.trim() || defaultName();
    const next = invoices.map((x) => (x.id === currentDoc.id ? { ...x, name } : x));
    setInvoices(next);
    await store.set(K.inv, next);
    flash("名前を変更しました");
  };

  const openInvoice = (id) => {
    const d = invoices.find((x) => x.id === id);
    if (!d) { setCurrentId(null); return; }
    setMeta(d.meta);
    setTo(d.to);
    setItems(d.items);
    setCurrentId(d.id);
    flash("読み込みました");
  };

  const deleteInvoice = async () => {
    const d = invoices.find((x) => x.id === currentId);
    if (!d) return;
    if (!window.confirm(`「${d.name || d.meta.no || "無題"}」を削除します。よろしいですか？`)) return;
    const next = invoices.filter((x) => x.id !== d.id);
    setInvoices(next);
    setCurrentId(null);
    await store.set(K.inv, next);
    flash("削除しました");
  };

  /* 保存済みの1件を下敷きにして新しい請求書を起こす */
  const copyInvoice = (id) => {
    const d = invoices.find((x) => x.id === id);
    if (!d) return;
    const y = new Date().getFullYear();
    setTo({ ...d.to });
    setItems(d.items.map((it) => ({ ...it, id: ++seq })));
    setMeta({
      ...d.meta,
      no: `BMB-${y}-${String(invoices.length + 1).padStart(4, "0")}`,
      issued: today(),
      due: "",
    });
    setCurrentId(null);
    flash(`「${d.name || d.meta.no}」をコピーしました`);
  };

  const newInvoice = () => {
    const y = new Date().getFullYear();
    setMeta({ no: `BMB-${y}-${String(invoices.length + 1).padStart(4, "0")}`, issued: today(), due: "", subject: "" });
    setTo({ company: "", honorific: "御中", person: "", zip: "", address: "", tel: "" });
    setItems([newRow(), newRow(), newRow()]);
    setCurrentId(null);
    flash("新しい請求書を作成しました");
  };

  /* --- 当社名の切り替え --- */
  const switchProfile = async (key) => {
    const p = PROFILES.find((x) => x.key === key);
    if (!p) return;
    const nextMe = { ...me, name: p.name };
    setProfileKey(key);
    setStamp(p.stamp);
    setMe(nextMe);
    await store.set(K.brand, { logo, stamp: p.stamp, me: nextMe, profileKey: key });
    flash(p.name + " に切り替えました");
  };

  /* --- バックアップ --- */
  const exportAll = async () => {
    const data = {
      app: "bmb-invoice", version: 1, exportedAt: new Date().toISOString(),
      invoices, customers, brand: { logo, stamp, me },
    };
    const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: "application/json" }));
    const a = document.createElement("a");
    a.href = url;
    a.download = `請求書バックアップ_${today()}.json`;
    a.click();
    URL.revokeObjectURL(url);
    flash("バックアップを書き出しました");
  };

  const importAll = (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!f) return;
    const r = new FileReader();
    r.onload = async () => {
      try {
        const d = JSON.parse(r.result);
        if (d.app !== "bmb-invoice") throw new Error("形式が違います");
        if (!window.confirm("現在の保存内容をこのバックアップで置き換えます。よろしいですか？")) return;
        const inv = Array.isArray(d.invoices) ? d.invoices : [];
        const cus = Array.isArray(d.customers) ? d.customers : [];
        setInvoices(inv); setCustomers(cus); setCurrentId(null);
        await store.set(K.inv, inv);
        await store.set(K.cus, cus);
        if (d.brand) {
          if (d.brand.logo) setLogo(d.brand.logo);
          if (d.brand.stamp) setStamp(d.brand.stamp);
          if (d.brand.me) setMe((m) => ({ ...m, ...d.brand.me }));
          await store.set(K.brand, d.brand);
        }
        flash("バックアップを読み込みました");
      } catch (err) {
        flash("読み込めませんでした：" + err.message);
      }
    };
    r.readAsText(f);
  };

  /* --- 請求先 --- */
  const saveCustomer = async () => {
    if (!to.company.trim()) { flash("請求先名を入力してください"); return; }
    const hit = customers.find((c) => c.company === to.company);
    const c = { ...to, id: hit ? hit.id : `cus-${Date.now()}` };
    const next = [c, ...customers.filter((x) => x.id !== c.id)];
    setCustomers(next);
    await store.set(K.cus, next);
    flash(hit ? "請求先を上書きしました" : "請求先を保存しました");
  };

  const pickCustomer = (id) => {
    const c = customers.find((x) => x.id === id);
    if (!c) return;
    setTo({ company: c.company, honorific: c.honorific || "御中", person: c.person || "",
            zip: c.zip || "", address: c.address || "", tel: c.tel || "" });
  };

  const deleteCustomer = async () => {
    const hit = customers.find((c) => c.company === to.company);
    if (!hit) { flash("この請求先は保存されていません"); return; }
    if (!window.confirm(`請求先「${hit.company}」を保存先から削除します。よろしいですか？`)) return;
    const next = customers.filter((x) => x.id !== hit.id);
    setCustomers(next);
    await store.set(K.cus, next);
    flash("請求先を削除しました");
  };

  const pickImage = (e, setter) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      setter(r.result);
      store.get(K.brand).then((b) => store.set(K.brand, { ...(b || {}), ...(setter === setLogo ? { logo: r.result } : { stamp: r.result }), me, profileKey }));
    };
    r.readAsDataURL(f);
    e.target.value = "";
  };

  const amountOf = (it) => Number(it.amount) || 0;

  const setItem = (id, key, val) =>
    setItems((rows) => rows.map((r) => (r.id === id ? { ...r, [key]: val } : r)));

  const totals = useMemo(() => {
    const sub = items.reduce((s, it) => s + amountOf(it), 0);
    const tax = Math.floor(sub * TAX_RATE);
    return { sub, tax, total: sub + tax };
  }, [items]);

  const css = `
    .bmb { --ink:#2c3b41; --soft:#6e8a92; --teal:#12a0b8; --teal-d:#0b7f95;
           --aqua:#e9f5f8; --aqua2:#cfe8ef; --line:#8fcedd; }
    .bmb *, .bmb *::before, .bmb *::after { box-sizing:border-box; }
    .bmb { background:#eef2f4; min-height:100vh; padding:28px 16px 64px; color:var(--ink);
           font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP","Meiryo",sans-serif;
           font-feature-settings:"palt" 1; -webkit-font-smoothing:antialiased; }
    .paper { width:210mm; max-width:100%; margin:0 auto; background:#fff; padding:13mm 14mm 12mm;
             border:1px solid var(--line); border-radius:8px;
             box-shadow:0 1px 3px rgba(20,60,70,.08), 0 16px 40px rgba(20,60,70,.12); }
    .f { font:inherit; color:inherit; background:transparent; border:0; border-bottom:1px solid transparent;
         padding:1px 3px; width:100%; border-radius:3px; transition:background .15s ease; }
    .f:hover { background:#f2fafc; }
    .f:focus { outline:none; background:var(--aqua); border-bottom-color:var(--teal); }
    .f::placeholder { color:#a9c4cc; }
    input[type="date"].f::-webkit-datetime-edit { text-align:right; }
    textarea.f { resize:vertical; line-height:1.7; }
    .num { text-align:right; font-variant-numeric:tabular-nums; letter-spacing:.03em; }
    .lbl { color:var(--soft); letter-spacing:.06em; }
    .meta { font-size:10.5px; line-height:1.75; }

    /* 見出しラベル（右端が矢羽根状のリボン） */
    .tag { display:inline-block; flex:none; background:var(--teal); color:#fff; font-size:10.5px;
           font-weight:500; letter-spacing:.12em; line-height:1.6; padding:3px 17px 3px 11px;
           clip-path:polygon(0 0, calc(100% - 9px) 0, 100% 50%, calc(100% - 9px) 100%, 0 100%);
           -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .box { border:1.5px solid var(--line); border-radius:6px; padding:5px 10px; background:#fff; }

    .tbl { width:100%; border-collapse:collapse; font-size:12px; border:1px solid var(--line); }
    .tbl thead th { background:var(--teal); color:#fff; font-weight:600; font-size:11px; letter-spacing:.12em;
                    text-align:center; padding:6px; border-right:1px solid rgba(255,255,255,.45);
                    -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .tbl thead th:last-child { border-right:0; }
    .tbl td { border-bottom:1px solid var(--aqua2); border-right:1px solid var(--aqua2);
              padding:6px; vertical-align:top; }
    .tbl td:last-child { border-right:0; }
    .tbl tbody tr:nth-child(even) td { background:var(--aqua);
              -webkit-print-color-adjust:exact; print-color-adjust:exact; }

    .sum-l { background:var(--aqua); color:var(--teal-d); border:1px solid var(--line);
             padding:7px 10px; letter-spacing:.28em; text-align:center;
             -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .sum-v { border:1px solid var(--line); padding:7px 12px; }

    .sel { font:inherit; color:inherit; background:transparent; border:1px solid var(--aqua2);
           border-radius:4px; padding:2px 6px; width:100%; }
    .sel:focus { outline:none; border-color:var(--teal); background:var(--aqua); }
    .btn { font:inherit; font-size:12px; letter-spacing:.05em; border:1px solid var(--line); background:#fff;
           color:var(--teal-d); border-radius:4px; padding:7px 16px; cursor:pointer;
           transition:background .15s ease, border-color .15s ease; }
    .btn:hover { border-color:var(--teal); background:var(--aqua); }
    .btn:focus-visible { outline:2px solid var(--teal); outline-offset:2px; }
    .btn-main { background:var(--teal); border-color:var(--teal); color:#fff; }
    .btn-main:hover { background:var(--teal-d); color:#fff; }
    .del { border:0; background:transparent; color:#a9c4cc; cursor:pointer; font-size:14px; padding:3px; line-height:1; }
    .del:hover { color:var(--teal-d); }
    .money { background:var(--aqua); border:1.5px solid var(--line); border-radius:6px; padding:12px 14px;
             -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .print-only { display:none; }
    .bar { width:210mm; max-width:100%; margin:0 auto 14px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    @media (prefers-reduced-motion: reduce) { .bmb * { transition:none !important; } }
    @media print {
      .bmb { background:#fff; padding:0; }
      .no-print { display:none !important; }
      .print-only { display:inline; }
      .paper { box-shadow:none; width:auto; padding:0; border:0; }
      .f, .f:hover, .f:focus { background:transparent !important; border-bottom-color:transparent !important; }
      .f::placeholder { color:transparent !important; }
      .sel { border-color:transparent; }
    }
    @page { size:A4; margin:13mm; }
  `;

  /* 小さなラベル付き1行 */
  const Line = ({ label, w = 52, children }) => (
    <div style={{ display: "flex", gap: 8, alignItems: "baseline" }}>
      <span className="lbl" style={{ width: w, flex: "none" }}>{label}</span>
      <span style={{ flex: 1, minWidth: 0 }}>{children}</span>
    </div>
  );

  return (
    <div className="bmb">
      <style>{css}</style>

      <div className="bar no-print" style={{ marginBottom: 8 }}>
        <button className="btn" onClick={newInvoice}>新規作成</button>
        <button className="btn btn-main" onClick={() => saveInvoice(false)}>
          {currentDoc ? "上書き保存" : "名前を付けて保存"}
        </button>
        {currentDoc && <button className="btn" onClick={() => saveInvoice(true)}>別名で保存</button>}
        <select className="sel" style={{ width: 268, background: "#fff", borderColor: "var(--line)", padding: "6px 12px" }}
                value={currentId || ""} onChange={(e) => openInvoice(e.target.value)}>
          <option value="">保存した請求書を開く（{invoices.length}件）</option>
          {invoices.map((d) => (
            <option key={d.id} value={d.id}>
              {d.name || d.meta.no || "無題"}　（{d.meta.issued}）
            </option>
          ))}
        </select>
        <select className="sel" style={{ width: 250, background: "#fff", borderColor: "var(--line)", padding: "6px 12px" }}
                value="" onChange={(e) => copyInvoice(e.target.value)}>
          <option value="">保存済みをコピーして新規作成</option>
          {invoices.map((d) => (
            <option key={d.id} value={d.id}>
              {d.name || d.meta.no || "無題"}　（{d.meta.issued}）
            </option>
          ))}
        </select>
        {currentDoc && <button className="btn" onClick={renameInvoice}>名前を変更</button>}
        {currentId && <button className="btn" onClick={deleteInvoice}>削除</button>}
        <button className="btn" onClick={exportAll}>バックアップ書き出し</button>
        <input ref={importRef} type="file" accept="application/json" style={{ display: "none" }} onChange={importAll} />
        <button className="btn" onClick={() => importRef.current.click()}>読み込み</button>
        <span style={{ fontSize: 11.5, color: "var(--teal-d)", letterSpacing: ".04em" }}>{status}</span>
      </div>

      <div className="bar no-print">
        <button className="btn btn-main" onClick={() => window.print()}>印刷 / PDFで保存</button>

        <select className="sel" style={{ width: 216, background: "#fff", borderColor: "var(--line)",
                                         padding: "6px 12px" }}
                value={profileKey} onChange={(e) => switchProfile(e.target.value)}>
          {PROFILES.map((p) => <option key={p.key} value={p.key}>{p.name}</option>)}
        </select>

        <input ref={logoRef} type="file" accept="image/*" style={{ display: "none" }}
               onChange={(e) => pickImage(e, setLogo)} />
        <button className="btn" onClick={() => logoRef.current.click()}>{logo ? "ロゴを変更" : "ロゴを追加"}</button>
        {logo && <button className="btn" onClick={() => setLogo(null)}>ロゴを削除</button>}

        <input ref={stampRef} type="file" accept="image/*" style={{ display: "none" }}
               onChange={(e) => pickImage(e, setStamp)} />
        <button className="btn" onClick={() => stampRef.current.click()}>{stamp ? "社判を変更" : "社判を追加"}</button>
        {stamp !== PROFILES.find((p) => p.key === profileKey).stamp && (
          <button className="btn"
                  onClick={() => setStamp(PROFILES.find((p) => p.key === profileKey).stamp)}>
            既定の社判に戻す
          </button>
        )}
      </div>

      <div className="paper">
        {/* 見出し + 日付・請求番号 */}
        <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", gap: 20 }}>
          <h1 style={{ margin: "2px 0 0", fontSize: 23, fontWeight: 600, letterSpacing: ".42em",
                       color: "var(--teal)" }}>
            請求書
          </h1>

          <div style={{ width: 246 }}>
            <div style={{ textAlign: "right", fontSize: 11.5, fontWeight: 500 }}>
              <input className="f no-print" type="date" value={meta.issued}
                     style={{ width: "auto", display: "inline-block", textAlign: "right" }}
                     onChange={(e) => setMeta({ ...meta, issued: e.target.value })} />
              <span className="print-only">{jpDate(meta.issued)}</span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 7, marginTop: 9 }}>
              <span className="tag">請求番号</span>
              <span className="box" style={{ flex: 1, minWidth: 0, fontSize: 12.5 }}>
                <input className="f" value={meta.no}
                       onChange={(e) => setMeta({ ...meta, no: e.target.value })} />
              </span>
            </div>
          </div>
        </div>

        {/* 請求先の呼び出し（印刷されません） */}
        <div className="no-print" style={{ display: "flex", gap: 8, alignItems: "center", margin: "10px 0 0" }}>
          <select className="sel" style={{ width: 246, flex: "none", background: "#fff", fontSize: 11 }}
                  value="" onChange={(e) => pickCustomer(e.target.value)}>
            <option value="">保存した請求先から選ぶ（{customers.length}件）</option>
            {customers.map((c) => (
              <option key={c.id} value={c.id}>{c.company}{c.person ? `　${c.person}` : ""}</option>
            ))}
          </select>
          <button className="btn" style={{ fontSize: 11, padding: "5px 12px" }} onClick={saveCustomer}>
            この請求先を保存
          </button>
          <button className="btn" style={{ fontSize: 11, padding: "5px 12px" }} onClick={deleteCustomer}>
            保存先から削除
          </button>
        </div>

        {/* 請求先 / 自社 */}
        <div style={{ display: "flex", gap: 18, alignItems: "flex-start", margin: "8px 0 0" }}>
          <div style={{ flex: "1 1 0", minWidth: 0 }}>
            <div style={{ display: "flex", alignItems: "baseline", gap: 6 }}>
              <input className="f" style={{ fontSize: 13.5, fontWeight: 500, letterSpacing: ".03em",
                                            borderBottom: "1px solid var(--line)" }}
                     value={to.company} placeholder="請求先名"
                     onChange={(e) => setTo({ ...to, company: e.target.value })} />
              <select className="sel no-print" style={{ width: 58, flex: "none", fontSize: 10.5 }}
                      value={to.honorific} onChange={(e) => setTo({ ...to, honorific: e.target.value })}>
                <option>御中</option><option>様</option>
              </select>
              <span className="print-only" style={{ fontSize: 12 }}>{to.honorific}</span>
            </div>
            <div className="meta" style={{ marginTop: 4 }}>
              <Line label="ご担当者">
                <input className="f" value={to.person} placeholder="担当者名"
                       onChange={(e) => setTo({ ...to, person: e.target.value })} />
              </Line>
              <Line label="住所">
                <span style={{ display: "flex", gap: 6, alignItems: "flex-start" }}>
                  <input className="f" style={{ width: 66, flex: "none" }} value={to.zip} placeholder="〒000-0000"
                         onChange={(e) => setTo({ ...to, zip: e.target.value })} />
                  <span style={{ flex: 1, minWidth: 0 }}>
                    <AutoText value={to.address} placeholder="住所" size={10.5}
                              onChange={(e) => setTo({ ...to, address: e.target.value })} />
                  </span>
                </span>
              </Line>
              <Line label="電話番号">
                <input className="f" value={to.tel} placeholder="00-0000-0000"
                       onChange={(e) => setTo({ ...to, tel: e.target.value })} />
              </Line>
            </div>
          </div>

          {/* 自社（社名の右に朱印を重ねる） */}
          <div style={{ width: 196, flex: "none" }}>
            {logo && (
              <img src={logo} alt="ロゴ"
                   style={{ maxHeight: 30, maxWidth: 150, objectFit: "contain", marginBottom: 5, display: "block" }} />
            )}

            <div>
              {/* 社名の行。社判は社名の右端（BMB の B あたり）に少し重ねる */}
              <div style={{ position: "relative", height: 46, paddingRight: 4 }}>
                <input className="f" style={{ fontSize: 14.5, fontWeight: 700, letterSpacing: ".04em" }}
                       value={me.name} onChange={(e) => setMe({ ...me, name: e.target.value })} />

                {stamp ? (
                  <img src={stamp} alt="社判"
                       style={{ position: "absolute", left: 74, top: -7, width: 58, height: 58,
                                objectFit: "contain", mixBlendMode: "multiply", opacity: .92,
                                pointerEvents: "none" }} />
                ) : (
                  <div className="no-print"
                       style={{ position: "absolute", left: 74, top: -7, width: 58, height: 58,
                                border: "1px dashed var(--aqua2)", borderRadius: 4, display: "grid",
                                placeItems: "center", fontSize: 8.5, color: "#a9c4cc", textAlign: "center",
                                lineHeight: 1.5, pointerEvents: "none" }}>
                    社判を<br />ここに
                  </div>
                )}
              </div>

              <div className="meta" style={{ color: "#41545a" }}>
                <input className="f" value={me.zip} onChange={(e) => setMe({ ...me, zip: e.target.value })} />
                <input className="f" value={me.address} onChange={(e) => setMe({ ...me, address: e.target.value })} />
                <input className="f" value={me.tel} placeholder="TEL"
                       onChange={(e) => setMe({ ...me, tel: e.target.value })} />
                <input className="f" value={me.regNo} placeholder="登録番号"
                       onChange={(e) => setMe({ ...me, regNo: e.target.value })} />
              </div>
            </div>
          </div>
        </div>

        {/* ごあいさつ・件名 */}
        <div style={{ color: "var(--teal-d)", fontSize: 12.5, margin: "16px 0 8px" }}>
          下記のとおりご請求申し上げます。
        </div>

        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 10, fontSize: 11.5 }}>
          <span className="tag">件名</span>
          <input className="f" style={{ borderBottom: "1px solid var(--aqua2)" }} value={meta.subject}
                 placeholder="案件名" onChange={(e) => setMeta({ ...meta, subject: e.target.value })} />
        </div>

        {/* ご請求金額・お支払日・お振込先 */}
        <div className="money" style={{ margin: "0 0 14px" }}>
          <div style={{ display: "flex", alignItems: "flex-end", gap: 20, flexWrap: "wrap" }}>
            <div style={{ display: "flex", alignItems: "flex-end", gap: 12, flex: "1 1 0", minWidth: 0 }}>
              <span className="tag" style={{ marginBottom: 7 }}>ご請求金額</span>
              <span className="num" style={{ fontSize: 27, fontWeight: 700, lineHeight: 1.1,
                                             borderBottom: "2px solid var(--teal)", padding: "0 12px 3px" }}>
                {yen(totals.total)}<span style={{ fontSize: 17 }}>-</span>
              </span>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span className="tag">お支払日</span>
              <span style={{ minWidth: 122, fontSize: 12.5, fontWeight: 600 }}>
                <input className="f no-print" type="date" value={meta.due}
                       onChange={(e) => setMeta({ ...meta, due: e.target.value })} />
                <span className="print-only">{jpDate(meta.due)}</span>
              </span>
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 8, marginTop: 11 }}>
            <span className="tag">お振込先</span>
            <span className="box" style={{ flex: 1, minWidth: 0, fontSize: 11.5, padding: "4px 10px" }}>
              <input className="f" value={me.bank} onChange={(e) => setMe({ ...me, bank: e.target.value })} />
            </span>
          </div>
        </div>

        {/* 明細（主役） */}
        <table className="tbl">
          <colgroup>
            <col style={{ width: "4%" }} />
            <col style={{ width: "10%" }} />
            <col />
            <col style={{ width: "24%" }} />
            <col style={{ width: "16%" }} />
            <col className="no-print" style={{ width: "3%" }} />
          </colgroup>
          <thead>
            <tr>
              <th>No.</th>
              <th style={{ fontSize: 9.5, letterSpacing: ".04em", whiteSpace: "nowrap" }}>タグ番号</th>
              <th>商品詳細</th>
              <th>作業内容</th>
              <th className="num">小計（税抜）</th>
              <th className="no-print" />
            </tr>
          </thead>
          <tbody>
            {items.map((it, i) => (
              <tr key={it.id}>
                <td className="num" style={{ color: "var(--soft)", fontSize: 11, textAlign: "center" }}>{i + 1}</td>
                <td>
                  <input className="f" style={{ fontSize: 9.5, whiteSpace: "nowrap", textOverflow: "ellipsis" }}
                         value={it.tag} placeholder="タグ番号"
                         onChange={(e) => setItem(it.id, "tag", e.target.value)} />
                </td>
                <td>
                  <AutoText value={it.detail} placeholder="色・ブランド名・特徴"
                            onChange={(e) => setItem(it.id, "detail", e.target.value)} />
                </td>
                <td>
                  <AutoText value={it.work} placeholder="作業内容"
                            onChange={(e) => setItem(it.id, "work", e.target.value)} />
                </td>
                <td className="num">
                  <input className="f num" inputMode="numeric" value={fmtInput(it.amount)}
                         onChange={(e) => setItem(it.id, "amount", e.target.value.replace(/[^\d-]/g, ""))} />
                </td>
                <td className="no-print" style={{ textAlign: "center" }}>
                  <button className="del" title="この行を削除"
                          onClick={() => setItems((r) => r.filter((x) => x.id !== it.id))}>×</button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>

        <button className="btn no-print" style={{ marginTop: 10 }}
                onClick={() => setItems((r) => [...r, newRow()])}>
          明細行を追加
        </button>

        {/* 備考欄・合計 */}
        <div style={{ display: "flex", gap: 16, marginTop: 16, alignItems: "flex-start" }}>
          <div style={{ flex: "1 1 0", minWidth: 0 }}>
            <span className="tag">備考欄</span>
            <div className="box" style={{ marginTop: 6, fontSize: 11.5 }}>
              <textarea className="f" rows={3} value={me.note}
                        onChange={(e) => setMe({ ...me, note: e.target.value })} />
            </div>
          </div>

          <table style={{ width: 276, flex: "none", borderCollapse: "collapse", fontSize: 12.5 }}>
            <tbody>
              <tr>
                <td className="sum-l" style={{ width: "50%" }}>小　計</td>
                <td className="sum-v num">{num(totals.sub)}</td>
              </tr>
              <tr>
                <td className="sum-l" style={{ letterSpacing: ".06em" }}>消費税（10%）</td>
                <td className="sum-v num">{num(totals.tax)}</td>
              </tr>
              <tr>
                <td className="sum-l">合計金額</td>
                <td className="sum-v num" style={{ fontSize: 15, fontWeight: 700 }}>{num(totals.total)}</td>
              </tr>
            </tbody>
          </table>
        </div>

      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<InvoiceMaker />);
</script>
</body>
</html>
